# Local development profile. Active by default (see spring.profiles.default).
spring:
  datasource:
    # PostgreSQL, not H2. An in-memory database that "works on my machine" is exactly how
    # dialect-specific bugs reach production — a generated-key strategy or a check constraint
    # that H2 accepts and PostgreSQL rejects. Dev runs the same engine as prod.
    #
    # Chapter 25 made these three overridable. The literal values are kept as *defaults* rather
    # than deleted, and the distinction is the whole point: `${DB_URL:jdbc:...}` means a laptop
    # still starts with no setup at all, while Docker Compose — which runs this same dev profile
    # against a container on a different host — supplies DB_URL/DB_USERNAME/DB_PASSWORD and needs
    # no second profile to do it.
    #
    # These defaults are not a secret being committed. They are the credentials of a database that
    # exists only on a developer's machine, listening on localhost, holding seed data. Compare
    # application-prod.yml, where the same three keys have deliberately NO default and an unset
    # variable stops the boot.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartwise_dev}
    username: ${DB_USERNAME:cartwise}
    password: ${DB_PASSWORD:cartwise}

    hikari:
      # Chapter 25. Five seconds, down from Hikari's 30-second default, and the reason is the
      # health check rather than request latency.
      #
      # With the database stopped, the `db` health indicator inherits this timeout — it was
      # measured taking 30012ms to answer, which is longer than any sensible probe interval and
      # long enough that Boot itself logs "took 30012ms to respond". A probe that times out before
      # its own health check returns learns nothing.
      #
      # Five seconds is far longer than a connection to a healthy database takes and short enough
      # that an unhealthy one is reported as unhealthy while a monitor is still listening.
      connection-timeout: 5000

  # Chapter 22. Flyway owns the schema now, in dev exactly as in prod.
  #
  # Boot auto-configures Flyway from the classpath alone, so `enabled` and `locations` below are
  # both the defaults restated. They are written out because this is the setting a reader comes
  # looking for when a migration did not run, and "it is the default" is a much harder answer to
  # find than a line in a file.
  #
  # The ordering that matters is not configured here and cannot be: Boot runs Flyway before it
  # creates the EntityManagerFactory, which is what allows `ddl-auto: validate` below to work
  # against a database that was empty a second earlier. Migrations build the schema, then Hibernate
  # checks it. There is no property to get this wrong, which is the reason it is reliable.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Was `create-drop` until Chapter 22, and the change is the point of that chapter.
      #
      # `create-drop` meant the entities were the schema: every boot rebuilt the tables from the
      # annotations and every shutdown destroyed them. That was defensible while the entities were
      # still moving and there was nothing in the database worth keeping. It also made a whole class
      # of change invisible — a column rename was a boot away from being "applied", with no record
      # that anything had happened and no way to apply the same change to a database that already
      # held data.
      #
      # `validate` means the opposite: Hibernate compares the entities against the schema Flyway
      # built and refuses to start if they disagree. It creates nothing and alters nothing. An
      # entity change with no matching migration is now a startup failure on a developer's laptop
      # rather than a deployment failure later, which is the whole trade — the same check prod has
      # always run (application-prod.yml), moved to where it is cheap to fail.
      #
      # The practical consequence, stated because it will be met on the first day: adding a field to
      # an entity no longer "just works" in dev. It needs a migration. That is the cost, and it is
      # the same cost the deployed environment was always going to charge.
      ddl-auto: validate

    # Log the generated DDL and SQL. On in dev because seeing the statements Hibernate emits is
    # the whole point of owning a schema you did not hand-write.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    # Keeps a session open for the whole request. Off deliberately: it hides lazy-loading mistakes
    # behind a still-open session in dev and then fails in any other context.
    open-in-view: false

    # FALSE as of Chapter 22, and this is the single line that decides whether the application
    # starts at all. It was `true` and had to change.
    #
    # It used to be load-bearing: it is what made data.sql run AFTER Hibernate had created the
    # tables, rather than before them against nothing. Hibernate no longer creates tables, so that
    # job is gone — but leaving the flag on is not merely redundant, it actively breaks the
    # ordering this chapter depends on, and it does so silently.
    #
    # What it actually does, from org.springframework.boot.jpa.JpaDatabaseInitializerDetector:
    #
    #     getDatabaseInitializerBeanTypes() returns EntityManagerFactory.class when
    #     spring.jpa.defer-datasource-initialization is true, and an empty set when it is false;
    #     detectionComplete() then calls configureOtherInitializersToDependOnJpaInitializers().
    #
    # Read that carefully. With the flag on, the EntityManagerFactory is itself registered as a
    # database initializer, and EVERY OTHER initializer — Flyway's included — is made to depend on
    # it. The order inverts: Hibernate runs first, Flyway second. That is exactly what
    # `defer-datasource-initialization` is for and exactly wrong here, because Hibernate running
    # first now means `validate` running first, against a database Flyway has not migrated yet.
    #
    # The symptom is nothing like the cause. Flyway's auto-configuration matches, its beans are
    # created, `spring.flyway.*` binds, and the log contains not one Flyway line before the boot
    # dies with
    #
    #     Schema validation: missing table [comparisons]
    #
    # which points at the entity mapping. Observed on a fresh database, diagnosed from the
    # condition-evaluation report plus the detector's bytecode, and recorded here because nothing
    # in the failure names this property.
    #
    # With it false, JpaDatabaseInitializerDetector detects nothing,
    # JpaDependsOnDatabaseInitializationDetector makes the EntityManagerFactory depend on the
    # database initializers instead, and Flyway runs first — which is the normal, documented
    # behaviour, available only once this flag stops overriding it.
    defer-datasource-initialization: false

  sql:
    init:
      # Chapter 22 narrowed what spring.sql.init is for.
      #
      # It used to load data.sql, which held the catalogue AND the two development accounts. The
      # catalogue moved to db/migration/V3__seed_products.sql, where Flyway applies it once in every
      # environment. The accounts did not, and could not: one of them is an ADMIN whose password is
      # printed in the source, and the only thing that has ever kept it out of production is
      # `spring.sql.init.mode: never` in application-prod.yml. A migration would have ignored that
      # and deployed it. See db/dev-seed/dev-users.sql for the full reasoning.
      #
      # So this mechanism survives, holding exactly the rows that must never leave a laptop.
      #
      # `always` because data.sql-style initialisation is skipped for non-embedded databases by
      # default, and PostgreSQL is not embedded — without it the script is silently not run.
      mode: always
      # Named explicitly rather than relying on the classpath:data.sql default. The default filename
      # is what made the old arrangement dangerous: any file called data.sql is picked up
      # automatically, so the admin row was one profile misconfiguration away from being seeded
      # anywhere. A path nobody loads by accident is the point.
      #
      # The former data.sql is kept at data.sql.bak — same directory, no longer a name Spring
      # recognises — as the record of what this file was split out of.
      data-locations: classpath:db/dev-seed/dev-users.sql

cartwise:
  jwt:
    # DEVELOPMENT KEY. Committed on purpose, and safe to commit only because it is worthless:
    # it signs tokens for a database that lives on one laptop and is reachable from nowhere else.
    # (Until Chapter 22 that sentence also said "and is dropped on every boot", which was a second
    # reason and is no longer true — the schema now survives restarts. The first reason was always
    # the load-bearing one.)
    # Anything that reaches a real user must read its key from the environment — see
    # application-prod.yml, where there is no default at all.
    #
    # The length is not padding. Tokens are signed with HS512, whose key must be at least 64
    # bytes; jjwt refuses a shorter one with WeakKeyException rather than signing something it
    # cannot sign safely, and JwtProperties checks the same thing at startup so the failure names
    # the property instead of surfacing at the first login.
    #
    # CHAPTER 25 — THIS KEY IS IN THE GIT HISTORY, AND THAT IS A PERMANENT FACT.
    #
    # It was committed in 9e002aa ("feat: implement Chapters 18-20 — auth, roles, and product
    # discovery with design tokens") and is recoverable by anyone who can read this repository's
    # history, forever, regardless of what this line says today. Parameterising it now does not
    # un-publish it, and pretending otherwise would be the dangerous kind of tidy-up.
    #
    # What limits the damage is what this key can sign for: a database on one laptop, reachable
    # from nowhere else. It has never been the key of any deployed environment — application-prod.yml
    # has no default and refuses to boot without JWT_SECRET — so there is no live session to forge.
    #
    # It is now overridable so that Docker Compose and any other non-laptop runner can supply a real
    # one. The default stays because a dev profile that cannot start without a secret store is a dev
    # profile people work around.
    secret: ${JWT_SECRET:cartwise-dev-only-signing-key-not-for-any-deployed-environment-0123456789}
    # 24 hours. Long enough not to interrupt a day of development, short enough that a token
    # copied out of a log or a browser's storage does not stay useful indefinitely. There are no
    # refresh tokens in this chapter, so this value is also exactly how long a session lasts
    # before the user has to sign in again.
    expiration: ${JWT_EXPIRATION:24h}

  cors:
    # The Vite dev server origin. 5173 is Vite's default and the port this repo's frontend
    # was observed serving on; 5174 is the fallback Vite picks when 5173 is already taken.
    # Both localhost and 127.0.0.1 are listed because they are distinct origins to the browser.
    #
    # Chapter 25 made this overridable, and doing so fixed a real bug rather than tidying config.
    #
    # As a hardcoded YAML list this could not be overridden by CARTWISE_ALLOWED_ORIGINS at all, so
    # the Docker Compose stack booted logging
    #
    #   Registering CORS mapping for /api/** with allowed origins
    #     [http://localhost:5173, http://127.0.0.1:5173, ...]
    #
    # while the containerised frontend is served from http://localhost:8081. Every API call the
    # browser made from that page would have failed its preflight — the stack would have come up
    # looking healthy and been unusable from the UI, which is the worst shape a deployment bug can
    # take.
    #
    # Written as a comma-separated default rather than a list because that is the form Spring can
    # bind an environment variable to; the relaxed binding maps a single scalar onto List<String>
    # by splitting on commas. The dev origins remain the default so a laptop needs no .env.
    allowed-origins: ${CARTWISE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

logging:
  level:
    com.cartwise: DEBUG
