# Settings shared by every profile.
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
spring:
  application:
    name: cartwise-backend
  profiles:
    # Running the app with no explicit profile is a developer on a laptop, so dev is the
    # default. Production must opt in via SPRING_PROFILES_ACTIVE=prod, which means an
    # unconfigured deployment fails loudly rather than silently serving dev settings.
    default: dev

server:
  port: 8080

  # Chapter 25 — HTTPS readiness.
  #
  # Spring Boot does not terminate TLS in this deployment and should not: the container serves
  # plain HTTP and a reverse proxy or load balancer in front of it holds the certificate. That
  # arrangement has one consequence that does NOT take care of itself, which is why this line
  # exists rather than being assumed.
  #
  # Behind a proxy, every request arrives claiming to be http:// from the proxy's own address. The
  # real scheme, host and client address are in X-Forwarded-Proto / -Host / -For. Without this
  # setting Spring ignores them, and anything that builds an absolute URL — a redirect, a Location
  # header — emits http:// against the public https:// origin, which browsers either block as mixed
  # content or downgrade. `framework` makes Boot register ForwardedHeaderFilter, which rewrites the
  # request to what the client actually asked for.
  #
  # This trusts whatever sends those headers, so the proxy must overwrite rather than append them.
  # If CartWise is ever exposed directly to the internet with no proxy, this must be set back to
  # `none` — a client could otherwise assert its own X-Forwarded-For. The same caveat governs the
  # rate limiter's IP keying; see RateLimitInterceptor.clientIp.
  forward-headers-strategy: framework

# ---------------------------------------------------------------------------------------------
# Actuator. Chapter 25.
# ---------------------------------------------------------------------------------------------
#
# Deliberately narrow. Actuator ships a large surface — env, beans, configprops, heapdump,
# threaddump — and several of those disclose exactly what Part A of this chapter spent its time
# removing from the repository: /actuator/env prints resolved configuration including, depending on
# sanitisation, the values of environment variables. Only health is exposed.
management:
  endpoints:
    web:
      exposure:
        # An allowlist, not a denylist. A future Boot version adding a new endpoint must not
        # publish it here by default.
        include: health
  endpoint:
    health:
      # Component detail — including which indicator is down — is shown to everyone, because
      # nothing sits in front of this to authenticate a probe. An orchestrator's liveness check
      # cannot present a JWT, so requiring one would mean the probe never passes.
      #
      # The trade is that an anonymous caller learns the database is unreachable. That is a fact an
      # unreachable database already makes obvious from the outside, and it is worth far less to an
      # attacker than a working health check is to an operator.
      show-details: always
      probes:
        # Splits /actuator/health into liveness and readiness groups.
        #
        # The distinction matters to an orchestrator: liveness answers "should this container be
        # restarted", readiness answers "should it receive traffic". A database outage must make
        # the app un-ready — removed from the pool — but NOT un-alive, because restarting a
        # perfectly healthy JVM does not bring a database back and a crash-loop makes the outage
        # worse.
        enabled: true

    # ------------------------------------------------------------------------------------------
    # A MEASURED FINDING ABOUT THE READINESS GROUP, AND WHY THE PROBE USES THE ROOT ENDPOINT.
    #
    # Boot's default readiness group contains `readinessState` alone — the application's own
    # lifecycle flag, which reports that the context finished starting and knows nothing whatever
    # about the database. With PostgreSQL deliberately stopped and the pool exhausted:
    #
    #   GET /actuator/health            → 503, db DOWN (CannotGetJdbcConnectionException)
    #   GET /actuator/health/readiness  → 200, {"status":"UP"}
    #
    # So a probe pointed at /readiness would call this container healthy while it could not serve
    # any request that touched the database — the "the JVM is running" health check this chapter
    # exists to eliminate, reintroduced one level down.
    #
    # The documented fix is `management.endpoint.health.group.readiness.include: readinessState,db`.
    # It was tried here and did NOT take effect on Boot 4.1.0 — readiness still answered 200/UP
    # after sixty seconds with the database down, verified with the property present in the jar's
    # application.yml. Boot 4 moved health into a separate `spring-boot-health` module and the
    # behaviour of that property there was not established; rather than ship configuration that
    # looks correct and demonstrably does nothing, it is removed and the finding recorded.
    #
    # docker-compose.yml therefore probes the ROOT /actuator/health, which was measured returning
    # 503 in exactly the case that matters. The cost is that the probe conflates liveness with
    # readiness — a database outage will eventually restart the container rather than merely
    # draining it — which is the wrong behaviour under an orchestrator and is accepted here only
    # because Compose has no separate readiness concept to lose. Anything running this under a
    # real orchestrator must resolve the group question first.
    # ------------------------------------------------------------------------------------------
  health:
    # Explicit rather than relying on the default. This is the indicator that makes the health
    # check mean something: it borrows a connection and runs a validation query, so a green
    # response is evidence the database answered, not that the process is alive.
    db:
      enabled: true

# CartWise-owned configuration. Bound by com.cartwise.config.CorsProperties.
# Deliberately no value here: each profile must name its own frontend origins, and an
# unset list registers no CORS mapping at all rather than falling back to something permissive.
cartwise:
  cors:
    allowed-origins: []

  # Chapter 24's image search, Chapter 25's environment wiring.
  #
  # Both credentials are read from the environment and both default to empty, which is the
  # supported anonymous mode rather than a broken one — OpenverseImageClient calls without a
  # bearer token when they are blank. They exist so a deployment CAN raise its rate ceiling, not
  # because it must.
  #
  # There is deliberately no literal here to move to a secret store later: the credential pair
  # obtained while writing Chapter 24 was never committed, which was checked rather than assumed.
  openverse:
    base-url: ${OPENVERSE_BASE_URL:https://api.openverse.org}
    client-id: ${OPENVERSE_CLIENT_ID:}
    client-secret: ${OPENVERSE_CLIENT_SECRET:}

    # Chapter 26.5. Written out explicitly at 20, which is OpenverseProperties' own default, and
    # pinned here with the reason so nobody raises it again.
    #
    # The backfill runs one search per CATEGORY and hands the results out round-robin, so the number
    # of DISTINCT photographs a category can show is capped by this value. Doubling the catalogue to
    # 100 made the largest category (Smartphone) 22 products, so 20 now means two of them share a
    # photograph. The obvious fix was to raise this to 50. It was tried, and it fails:
    #
    #     GET /v1/images/?q=smartphone&page_size=50&license_type=commercial
    #     401  {"detail":"page_size may not exceed 20 for anonymous requests"}
    #
    # 20 is a hard upstream ceiling for unauthenticated callers, not a client-side default. The
    # failure is also worth recording because of its SHAPE: OpenverseImageClient turns a non-2xx
    # into an empty result list, so the backfill did not error — it reported every one of the 52
    # products as "unmatched" and left them on placeholders. A configuration change produced a
    # silent, complete data outage that looked like Openverse having no pictures of laptops.
    #
    # Raising it is possible, but only with credentials: OPENVERSE_CLIENT_ID/SECRET above lift the
    # ceiling. Registering for those is the documented path and is out of this chapter's scope, so
    # the catalogue lives with a small amount of repeated photography in its two largest categories.
    # That repetition is recorded in the chapter report rather than hidden.
    page-size: ${OPENVERSE_PAGE_SIZE:20}

  # Chapter 25, extended in Chapter 26. See RateLimitProperties for what each bucket protects and
  # why they differ.
  rate-limit:
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-refill-seconds: ${RATE_LIMIT_AUTH_REFILL_SECONDS:60}
    write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:60}
    write-refill-seconds: ${RATE_LIMIT_WRITE_REFILL_SECONDS:60}
    admin-capacity: ${RATE_LIMIT_ADMIN_CAPACITY:3}
    admin-refill-seconds: ${RATE_LIMIT_ADMIN_REFILL_SECONDS:3600}
    click-capacity: ${RATE_LIMIT_CLICK_CAPACITY:30}
    click-refill-seconds: ${RATE_LIMIT_CLICK_REFILL_SECONDS:60}

  # ---------------------------------------------------------------------------------------------
  # Chapter 26 — affiliate outbound links.
  # ---------------------------------------------------------------------------------------------
  #
  # NO REAL AFFILIATE CREDENTIAL IS PRESENT IN THIS FILE OR ANYWHERE IN THIS REPOSITORY.
  #
  # `cartwise-test-00` is an obvious placeholder and is meant to be recognisable as one on sight. It
  # is not a tag issued by anybody, it tracks nothing, and a purchase made through a link carrying it
  # earns CartWise nothing. Getting a real one is a process a human has to complete and a build
  # cannot: Amazon Associates evaluates an application and only confirms it after three qualifying
  # sales inside 180 days, and Flipkart has not accepted direct affiliate sign-ups since 5 May 2018 —
  # its catalogue is reachable only through a network (Cuelinks, EarnKaro, CJ and similar), which is
  # its own application.
  #
  # WHAT "ZERO CODE CHANGES TO GO LIVE" MEANS HERE, CONCRETELY
  #
  # Every field that would have to change on approval is an environment variable:
  #
  #   tag        the credential itself
  #   tag-param  the query parameter it goes in — `tag` for Amazon, `affid` for Flipkart, and
  #              genuinely unknown for the three Indian electronics chains, whose programmes run
  #              through networks rather than a documented first-party parameter. Theirs is left
  #              EMPTY rather than guessed: an invented parameter name would produce a link that
  #              looks tagged, is not, and is described to the user as an affiliate link — a false
  #              disclosure, which is worse than no disclosure.
  #   search-url the destination. Overridable because a retailer joined through a network is not
  #              linked at its own domain at all; the link goes through the network's redirector.
  #              Without this, the one route currently open for four of these five retailers would
  #              still require a code change.
  #
  # A retailer with no tag-param still gets a working, tracked link to its own search page. The
  # click is recorded, the shopper reaches the right place, and CartWise earns nothing — which is
  # the true state of affairs and what /api/affiliate/retailers reports.
  #
  # URL SHAPES, MEASURED RATHER THAN ASSUMED
  #
  #   Amazon.in    /s?k=<term>&tag=<associate tag>   — `tag` is the Associates tracking parameter
  #   Flipkart     /search?q=<term>&affid=<affiliate id>  — `affid` per Flipkart's affiliate API docs
  #   Croma        /searchB?q=<term>:relevance&text=<term>
  #   Reliance     /products?q=<term>
  #   Vijay Sales  /search-listing?q=<term>
  #
  # THE LAST THREE WERE WRONG ON THE FIRST ATTEMPT, AND HTTP 200 IS WHY.
  #
  # The obvious guesses — reliancedigital.in/search?q= and vijaysales.com/search?q= — both answer
  # 200 to curl, and both are wrong. Reliance renders "Oops! The page was not found" inside that
  # 200; Vijay Sales renders a search page listing gaming laptops, having ignored the parameter
  # entirely. Croma answers 403 to curl outright (a WAF), and in a browser its one-parameter form
  # returns a page titled "Search null" with no results, because the storefront reads the human
  # search term from `text` and treats `q` as a facet expression.
  #
  # All five were therefore established by driving each retailer's own search box in a real browser
  # and reading the URL it produced. A status code is not evidence that a search worked, and for a
  # monetised link the failure is silent in both directions: the shopper lands somewhere plausible
  # and the referral is simply worthless.
  #
  # Links point at each retailer's SEARCH, not at a specific listing. CartWise has no mapping from
  # its catalogue to any retailer's SKU (no ASIN, no Flipkart PID), and a deep link built from a
  # guess would land the shopper on the wrong product. See AffiliateLinkService.
  affiliate:
    # The value that means "this is not a real account". A retailer configured with it is reported
    # as PLACEHOLDER rather than PAID, which is what stops the disclosure page telling readers that
    # CartWise earns a commission it does not earn. Change this only if you change the stand-in
    # below; setting it to a real tag would suppress the honest answer.
    placeholder-tag: cartwise-test-00

    retailers:
      amazon:
        display-name: Amazon
        search-url: ${AFFILIATE_AMAZON_SEARCH_URL:https://www.amazon.in/s}
        query-param: k
        tag-param: ${AFFILIATE_AMAZON_TAG_PARAM:tag}
        tag: ${AFFILIATE_AMAZON_TAG:cartwise-test-00}

      flipkart:
        display-name: Flipkart
        search-url: ${AFFILIATE_FLIPKART_SEARCH_URL:https://www.flipkart.com/search}
        query-param: q
        tag-param: ${AFFILIATE_FLIPKART_TAG_PARAM:affid}
        tag: ${AFFILIATE_FLIPKART_TAG:cartwise-test-00}

      # The three below have NO tag by default, and that is the honest position rather than an
      # incomplete one. None publishes a first-party affiliate parameter; each is reachable only
      # through an affiliate network, which issues its own link format. Both halves are
      # configurable, so joining one is still a deployment change and not a code change.
      croma:
        display-name: Croma
        search-url: ${AFFILIATE_CROMA_SEARCH_URL:https://www.croma.com/searchB}
        query-param: q
        # `q` carries the facet expression, `text` carries the human search term. Both are
        # required — `q` alone renders "Search null" and no results.
        query-suffix: ":relevance"
        secondary-query-param: text
        tag-param: ${AFFILIATE_CROMA_TAG_PARAM:}
        tag: ${AFFILIATE_CROMA_TAG:}

      reliance-digital:
        display-name: Reliance Digital
        # /products, not /search. /search?q= returns HTTP 200 with a "page was not found" body.
        search-url: ${AFFILIATE_RELIANCE_SEARCH_URL:https://www.reliancedigital.in/products}
        query-param: q
        tag-param: ${AFFILIATE_RELIANCE_TAG_PARAM:}
        tag: ${AFFILIATE_RELIANCE_TAG:}

      vijay-sales:
        display-name: Vijay Sales
        # /search-listing, not /search. /search?q= returns 200 and ignores the term.
        search-url: ${AFFILIATE_VIJAY_SALES_SEARCH_URL:https://www.vijaysales.com/search-listing}
        query-param: q
        tag-param: ${AFFILIATE_VIJAY_SALES_TAG_PARAM:}
        tag: ${AFFILIATE_VIJAY_SALES_TAG:}
