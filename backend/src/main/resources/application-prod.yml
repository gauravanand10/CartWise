# Production profile — structure only. No real values are committed here, and none should be.
#
# Everything environment-specific is read from environment variables so that secrets and hosts
# live in the deployment platform, not in Git. Security settings are absent because that
# subsystem does not exist yet (Chapter 18).

server:
  port: ${PORT:8080}

spring:
  datasource:
    # No default value on purpose. An unset DB_URL must fail the boot, not fall back to a
    # localhost database that happens to be reachable — a production process quietly writing to
    # someone's laptop is a worse failure than not starting.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # Chapter 25. Matches application-dev.yml, and matters more here than there.
      #
      # Hikari's 30-second default is inherited by Actuator's `db` health indicator, which was
      # measured taking 30012ms to report a stopped database. A container orchestrator's probe
      # interval is shorter than that, so the probe times out before the health check it is waiting
      # on has decided anything — and a health check that cannot answer within the probe's patience
      # is a health check that never reports the outage.
      connection-timeout: 5000

  # Chapter 22. The migration tool the ddl-auto note below used to defer to.
  #
  # Identical to application-dev.yml, and that is the property worth having rather than a
  # duplication worth removing: the migrations that ran on a laptop are the migrations that run
  # here, in the same order, from the same folder. A prod-only location or a prod-only flag would
  # mean the deployed schema had a code path nobody exercises until the deploy.
  #
  # No `baseline-on-migrate`. It tells Flyway to accept a database that already has tables and
  # pretend they are the baseline, which is exactly what you want during a one-off adoption and
  # exactly what you do not want left switched on: it converts "this database is not in the state I
  # think it is" from a failed deploy into a silent success. CartWise has no deployed database yet,
  # so V1 runs on an empty schema and there is nothing to baseline. If that changes, it is a
  # deliberate one-time `-Dflyway.baselineOnMigrate=true` on the command line, not a line in a file.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Never `create-drop`, never `update`. `validate` checks the deployed schema matches the
      # entities and refuses to start on a mismatch, so a schema drift is caught at deploy time
      # instead of on the first query that touches the missing column. It changes nothing itself:
      # applying schema changes is a migration tool's job.
      #
      # As of Chapter 22 that job has an owner. Flyway runs above, before the EntityManagerFactory
      # exists, so this check now runs against a schema that was just brought up to date rather than
      # against whatever a human last applied by hand. Unchanged setting, considerably stronger
      # guarantee — and dev runs the same one now, so a mismatch is found on a laptop first.
      ddl-auto: validate

    show-sql: false
    open-in-view: false

  sql:
    init:
      # Sample data is a development convenience. Seeding a production database from a file
      # committed to the repository is not.
      #
      # This line carries more weight after Chapter 22, not less. spring.sql.init now loads exactly
      # one file — db/dev-seed/dev-users.sql — and that file contains an ADMIN account with a real
      # BCrypt hash whose plaintext is written in the comment beside it. `never` is the only thing
      # standing between that row and a deployed database. It is why those accounts stayed under
      # spring.sql.init instead of moving into db/migration with the catalogue: a Flyway migration
      # runs in every environment by design and would have ignored this setting entirely.
      mode: never

cartwise:
  jwt:
    # No default, exactly like DB_URL above and for a stronger reason. A fallback value here would
    # be a signing key published in this repository: anyone who could read it could mint a valid
    # token for any user id and would be, as far as the API could tell, that user. An unset
    # JWT_SECRET must stop the boot.
    #
    # Generate at least 64 random bytes, e.g.
    #   openssl rand -base64 64
    # and set it in the deployment platform's secret store, never in a file that is committed.
    #
    # Rotating this key invalidates every token signed with the old one, so users are signed out.
    # That is the intended behaviour of a rotation and the reason it is worth doing after any
    # suspected exposure.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}

  cors:
    # Comma-separated list of deployed frontend origins, e.g.
    # CARTWISE_ALLOWED_ORIGINS=https://cartwise.example.com
    # Unset means no CORS mapping is registered — a misconfigured deploy fails visibly.
    #
    # CHAPTER 30 — THE ANDROID APP NEEDS AN ENTRY HERE, AND IT IS NOT A URL.
    #
    # If CartWise ships the Play Store build, this list must ALSO contain
    #
    #     https://localhost
    #
    # exactly as written: no port, no host name. Capacitor serves the bundle
    # from the device through a local content provider, so the WebView's origin
    # is literally `https://localhost` — see `frontend/capacitor.config.ts`,
    # where `androidScheme: "https"` fixes it. It is not the phone talking to a
    # server on itself, and it does not vary per device or per install.
    #
    # This is worth the paragraph because of how the failure presents. The app
    # launches, the splash clears, and every screen renders its chrome perfectly
    # while showing an error where the data should be — it looks like the API is
    # down rather than like a config line is missing. That is exactly what the
    # emulator run in Chapter 30 produced, and the reason was only visible in
    # logcat as a CORS preflight rejection.
    #
    # An iOS build, if one is ever produced, adds `capacitor://localhost` on the
    # same reasoning. It is not listed here because no iOS project exists yet
    # and an allowlist entry for a platform that does not ship is a permission
    # granted for nothing.
    allowed-origins: ${CARTWISE_ALLOWED_ORIGINS:}

logging:
  # Chapter 25 — structured logging, and where it goes.
  #
  # WHERE: nowhere. There is deliberately no `logging.file.name` in any profile, which means Spring
  # Boot logs to stdout and stops there. That is the correct behaviour for a container and the
  # reason it is worth a comment rather than a config line: a log file inside a container is
  # written to a layer that vanishes with the container, on a path the host does not have. The
  # runtime collects stdout. Adding a file appender here would hide the logs, not preserve them.
  #
  # WHAT: ECS JSON, one object per line, instead of the human-oriented default. The default layout
  # is aligned columns with a wrapped stack trace, which reads well in a terminal and is close to
  # unparseable for a log aggregator — a multi-line exception arrives as a dozen unrelated records.
  # Structured output makes each event one record with real fields, so "every 429 in the last hour"
  # is a query rather than a grep with a regex for the timestamp format.
  #
  # Applied to prod only. Development keeps the readable layout, because the reader there is a
  # person watching a terminal, and JSON would make the thing that helps most in dev — seeing what
  # just happened at a glance — considerably worse.
  structured:
    format:
      console: ecs

  level:
    root: INFO
    com.cartwise: INFO

    # Explicitly INFO, not DEBUG, and this line is a safety rail rather than a default restated.
    #
    # Hibernate at DEBUG logs every statement it issues, and org.hibernate.orm.jdbc.bind at TRACE
    # logs the bound parameters — which for this schema means BCrypt password hashes on the insert
    # that creates an account. Neither is a credential in plaintext, but a password hash in a log
    # aggregator is a hash an attacker can take away and grind offline at their leisure.
    #
    # spring.jpa.show-sql is already false in this profile; this covers the other route to the same
    # output, which is a logger level someone raises while debugging a production incident.
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
