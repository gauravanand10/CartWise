# Test profile.
#
# This file is the ONE place the test suite's schema strategy is declared.
#
# Chapter 22 arrived and did NOT make the swap this header used to promise. That is a decision, and
# reversing a written prediction deserves the reasoning rather than a quiet edit.
#
# The suite keeps `ddl-auto: create-drop` and turns Flyway OFF. Migrations are pure DDL against a
# schema that is already correct by construction here: @DataJpaTest builds the schema from the
# entities, which is the same thing V1 transcribes, and running both would mean the tests exercise
# a code path (Flyway) that has nothing to do with what they assert while adding a migration replay
# to every context that is not shared. Speed is the smaller half of that; the larger half is that a
# repository test failing because a seed migration inserted fifty products it did not ask for is a
# test that has stopped being about its own subject. V3 seeds a catalogue, and this suite's stated
# rule (below) is that fixture data belongs to the test that needs it.
#
# The limitation the old header described therefore still stands, and is now permanent rather than
# pending: repository tests run against a schema Hibernate generated from the entities, NOT the
# schema a deployment gets from db/migration. Concretely, `idx_products_lower_category` — the
# functional index V2 adds — does not exist in the test database, because @Index cannot express it
# and Hibernate is what builds this schema. Any test asserting on that index would be asserting
# about something that exists nowhere in this profile, and is marked in the test that makes the
# claim.
#
# What guards the gap instead: `ddl-auto: validate` in dev and prod. If V1 and the entities ever
# disagree, the application fails to start on a developer's laptop — which is a louder signal than
# a test would give, and it is checked on every single dev boot rather than once per CI run.
#
# There is no `spring.datasource.*` block. The URL, username and password of the PostgreSQL
# container are discovered at runtime by @ServiceConnection (see PostgresTestContainerConfig).
# Hard-coding them here would be a second source of truth that is wrong the moment the container
# picks a different ephemeral port, which it does on every run.

spring:
  # OFF, explicitly. This is not a default being restated — Boot's default is `true`, and
  # flyway-core is `runtime` scope, which Maven puts on the test classpath. Leaving this out means
  # Flyway auto-configures itself in every test context: V1 creates the tables, then Hibernate's
  # `create-drop` drops and recreates them underneath it, leaving a flyway_schema_history claiming
  # migrations are applied to a schema Flyway no longer built. The failure that produces is
  # confusing out of proportion to its cause, and one line prevents it.
  flyway:
    enabled: false

  jpa:
    hibernate:
      # See the note above. `create-drop` per context, not per test method: Spring's context cache
      # keeps one container and one schema alive across every class sharing this configuration,
      # and each test is isolated by transaction rollback instead (@DataJpaTest does this by
      # default). Recreating the schema per class would be slower and would not isolate anything
      # that a rollback does not already isolate.
      ddl-auto: create-drop

    # Off. A passing test run should be readable; a failing one is diagnosed from the assertion
    # message and the stack trace, not by scrolling past several thousand INSERT statements.
    # Turn it on locally with -Dspring.jpa.show-sql=true when a query is the thing under suspicion.
    show-sql: false

    # Same reason as dev and prod: a session held open for the whole request hides lazy-loading
    # mistakes. A test that only passes because the session was still open is a test that will
    # not reproduce the bug it was written to catch.
    open-in-view: false

    # No data.sql in tests. Seed data belongs to the test that needs it, built by that test, so
    # a failure names the rows it was actually about. A shared fixture file is how tests start
    # depending on each other's data without saying so.
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

cartwise:
  # Chapter 25 — rate limiting OFF for the suite, and this is a deliberate decision rather than a
  # convenience.
  #
  # Turning it on broke seven tests in AuthControllerTest the moment it was added, and the failures
  # were the limiter working correctly. Every request MockMvc makes reports the same client
  # address, so an entire test class shares one bucket: the eleventh assertion in the class got a
  # 429 instead of the 401 or 400 it was written to check. Nothing was wrong with those tests —
  # they assert on authentication behaviour and had no reason to anticipate a throttle.
  #
  # Zero capacity disables the bucket outright (see TokenBucket, where that behaviour exists for
  # exactly this reason plus the ability to switch a limit off in production without a redeploy).
  #
  # The limiter is NOT therefore untested. RateLimitInterceptorTest re-enables it with a tiny
  # capacity via @TestPropertySource and asserts the 429, the ApiError body and the Retry-After
  # header — testing it in one place that opts in, rather than having every other test in the
  # project quietly depend on staying under a threshold.
  rate-limit:
    auth-capacity: 0
    write-capacity: 0
    admin-capacity: 0

  jwt:
    # A signing key that exists only to satisfy JwtProperties' startup validation and to sign
    # tokens that never leave the JVM. It is >= 64 bytes because HS512 requires it and jjwt
    # throws WeakKeyException rather than sign with a short key — the same constraint dev has,
    # for the same reason, so a test cannot accidentally pass under weaker rules than dev.
    secret: "cartwise-test-only-signing-key-never-deployed-anywhere-0123456789abcdef"
    expiration: 24h

  cors:
    # A single concrete origin. Not a wildcard: the CORS tests need something to assert against,
    # and an empty list registers no mapping at all, which would make those assertions vacuous.
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    root: WARN
    com.cartwise: INFO
    # Testcontainers narrates image pulls and container startup at INFO. Useful the first time,
    # noise on every run after that.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
