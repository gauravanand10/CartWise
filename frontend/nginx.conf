# nginx config for the CartWise SPA. Chapter 25.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs to stdout/stderr, not to /var/log/nginx.
    #
    # The stock image already symlinks those paths to the container's stdout, so this is that
    # behaviour made explicit rather than a change — written down because it is the container
    # logging rule this chapter is asserting, and a future edit adding a real file path here would
    # silently send the logs somewhere nothing collects them.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ------------------------------------------------------------------------------------------
    # Security headers.
    #
    # The backend sets its own (see SecurityConfig); these cover the documents and assets nginx
    # serves, which Spring Security never sees. Both halves are needed — a header on the API
    # response does nothing for the HTML that loaded the page.
    # ------------------------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSP for the built bundle, and it is looser than the backend's `default-src 'none'` for
    # reasons specific to what actually loads here:
    #
    #   'unsafe-inline' for styles — Tailwind is compiled to a stylesheet, but the build also emits
    #     inline style attributes, and Vite injects a small inline style block. Removing this needs
    #     a nonce or hash pipeline, which is a build change rather than a config line.
    #   img-src https: and data: — Chapter 24's product photography is served from third-party
    #     hosts (Flickr and friends, via Openverse), so an origin allowlist here would break every
    #     product image the moment Openverse returned a host not on it.
    #   connect-src 'self' plus the API origin is NOT expressible here, because the API origin is a
    #     deploy-time value and this file is static. Left as 'self' *and* http/https so the
    #     cross-origin API call works; tightening it is a deployment-templating task.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'" always;

    # ------------------------------------------------------------------------------------------
    # Caching
    # ------------------------------------------------------------------------------------------

    # Vite fingerprints asset filenames with a content hash, so a given /assets/ file can never
    # change meaning. Those are immutable for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html is the opposite and must never be cached: it is the document that *names* the
    # current hashed bundles. A cached copy points at the previous deploy's assets, which the
    # immutable rule above has already let the browser keep — so a stale index plus fresh assets is
    # a user pinned to an old version of the app with no way to escape but a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ------------------------------------------------------------------------------------------
    # SPA routing
    # ------------------------------------------------------------------------------------------
    #
    # Every unmatched path falls back to index.html so React Router can resolve it client-side.
    # This is what makes /browse and /product/:slug work on a page *reload* rather than only on an
    # in-app navigation — without it nginx looks for a file called `browse`, does not find one, and
    # returns its own 404 before any JavaScript runs.
    #
    # The cost, and it is real: a genuinely wrong URL now returns 200 with the app shell rather
    # than a 404 status. The app renders its NotFound page, so a human sees the right thing, but a
    # crawler sees a success. Fixing that properly needs server-side rendering, which this
    # application does not have.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
